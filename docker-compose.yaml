services:
  database:
    ###> doctrine/doctrine-bundle ###
    # Matches the production server (Plesk, MariaDB 12.3)
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: 'main'
      MARIADB_USER: 'main'
      MARIADB_PASSWORD: 'main'
      MARIADB_ROOT_PASSWORD: 'main'
    ports:
      - '3306'
    expose:
      - '3306'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      timeout: 20s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  ###< doctrine/doctrine-bundle ###

  pma:
    image: phpmyadmin
    environment:
      - PMA_HOST=database
    ports:
      - '6080:80'
    depends_on:
      - database

volumes:
  mariadb-data:


###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
