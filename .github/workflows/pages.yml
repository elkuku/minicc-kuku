name: GitHub Pages

# Publish the coverage report only after CI has passed on master.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

env:
  APP_ENV: test
  DATABASE_URL: 'mysql://root:password@127.0.0.1:3306/app?serverVersion=8.0&charset=utf8mb4'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build exactly the commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql
          coverage: xdebug

      - name: Install Dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          require-lock-file: true

      - name: Setup Database
        run: php bin/console doctrine:database:create --if-not-exists

      - name: Run Tests with Coverage
        env:
          XDEBUG_MODE: coverage
        run: vendor/bin/phpunit --coverage-html coverage

      - name: Assemble Site
        run: |
          mkdir _site
          mv coverage _site/coverage
          cat > _site/index.html <<'HEREDOC'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>MiniCC KuKu</title>
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
          </head>
          <body>
          <div class="container py-5">
          <div class="row justify-content-center">
          <div class="col-lg-8">
          <h1 class="mb-3">MiniCC KuKu</h1>
          <p class="lead text-secondary">Financial management application for handling credit cards, deposits, transactions, and store management.</p>
          <hr>
          <h5>Tech Stack</h5>
          <ul>
          <li>PHP 8.5+ with Symfony 8.x</li>
          <li>Doctrine ORM with PostgreSQL</li>
          <li>Twig 3.x with Bootstrap 5.3</li>
          <li>Stimulus.js</li>
          </ul>
          <hr>
          <h5>Reports</h5>
          <ul>
          <li><a href="coverage/">Code Coverage Report</a></li>
          </ul>
          <hr>
          <p><a href="https://github.com/elkuku/minicc-kuku" class="btn btn-outline-dark btn-sm">View on GitHub</a></p>
          <p class="text-muted small">Last updated: TIMESTAMP_PLACEHOLDER</p>
          </div>
          </div>
          </div>
          </body>
          </html>
          HEREDOC
          sed -i "s/TIMESTAMP_PLACEHOLDER/$(date -u '+%Y-%m-%d %H:%M:%S UTC')/" _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
